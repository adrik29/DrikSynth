name: Compilar DrikSynth (Windows)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Se chegar alteracao nova, cancela a compilacao anterior em vez de publicar duas.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Empacotar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pacote | Out-Null
          Copy-Item -Recurse build/DrikSynth_artefacts/Release/VST3/DrikSynth.vst3 pacote/
          Copy-Item build/DrikSynth_artefacts/Release/Standalone/DrikSynth.exe pacote/
          Copy-Item LEIA-ME-instalacao.txt pacote/
          Compress-Archive -Path pacote/* -DestinationPath DrikSynth-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DrikSynth-Windows
          path: DrikSynth-Windows.zip

      - name: Publicar em Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versao = (Select-String -Path CMakeLists.txt -Pattern 'project\(DrikSynth VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          gh release delete ultima-compilacao --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          gh release create ultima-compilacao DrikSynth-Windows.zip `
            --target $env:GITHUB_SHA `
            --title "DrikSynth v$versao" `
            --notes "Versao $versao. Gerado automaticamente a partir de $env:GITHUB_SHA. Instrucoes no LEIA-ME dentro do zip." `
            --prerelease
